//   HIGH = 2;
// }

message Ticket {
  string id = 1;
  string ticketNo = 2;
  string orgId = 3;
  string title = 4;
  string description = 5;
  string createdByUserId = 6;
  string assigneeUserId = 7; 
  string status = 8;
  string priority = 9;
  string createdAt = 10;
  string updatedAt = 11;
}

message Comment {
  string id = 1;
  string ticketId = 2;
  string orgId = 3;
  string authorUserId = 4;
  string body = 5;
  string createdAt = 6;
}

message CreateTicketRequest {
  string orgId = 1;
  string orgName = 2;
  string title = 3;
  string description = 4;
  string priority = 5;
  string createdByUserId = 6;
}

message TicketResponse { Ticket ticket = 1; }

message GetTicketRequest { string orgId = 1; string ticketId = 2; }

message ListTicketsRequest {
  string orgId = 1;
  repeated string status = 2; 
  repeated string priority = 3; 
  string assigneeUserId = 4; 
  string createdByUserId = 5;
  int32 limit = 6; // pagination
  string cursor = 7; // pagination
}

message ListTicketsResponse {
  repeated Ticket tickets = 1;
  string nextCursor = 2;
}

message AddCommentRequest {
  string orgId = 1;
  string ticketId = 2;
  string body = 3;
  string authorUserId = 4;
}

message CommentResponse { Comment comment = 1; }

message AssignTicketRequest {
  string orgId = 1;
  string ticketId = 2;
  string assigneeUserId = 3;
  string actorUserId = 4; // who assigns (for audit)
}

message TransitionStatusRequest {
  string orgId = 1;
  string ticketId = 2;
  string newStatus = 3; 
  string actorUserId = 4;
  string reason = 5; // optional
}
